[package]
name = "rod"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"  # std::sync::LazyLock
description = "Handy-compatible bridge for an IAI linear actuator (Modbus RTU)"
license = "MIT"

[[bin]]
name = "rod"
path = "src/main.rs"

[dependencies]
tokio                 = { version = "1", features = ["full"] }
tokio-modbus          = { version = "0.11", default-features = false, features = ["rtu"] }
tokio-serial          = "5"
prost                 = "0.12"
serde                 = { version = "1", features = ["derive"] }
serde_json            = "1"
toml                  = "0.8"
tracing               = "0.1"
tracing-subscriber    = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = "0.28"
opentelemetry         = { version = "0.27", features = ["metrics", "logs", "trace"] }
opentelemetry_sdk     = { version = "0.27", features = ["rt-tokio", "metrics", "logs"] }
opentelemetry-otlp    = { version = "0.27", features = ["grpc-tonic", "http-proto", "metrics", "logs"] }
opentelemetry-appender-tracing = "0.27"
opentelemetry-semantic-conventions = "0.27"
thiserror             = "1"
anyhow                = "1"
rand                  = "0.8"
futures              = "0.3"

# Real BLE peripheral only builds on Linux (BlueZ / D-Bus). On other platforms a
# no-op stub is compiled instead so the rest of the bridge still builds & tests.
[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17", features = ["full"] }

[build-dependencies]
prost-build = "0.12"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
