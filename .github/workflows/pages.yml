name: deploy-pages

# Builds the web UI and publishes it to GitHub Pages on every push to main.
#
# Uses the native Pages deployment (actions/deploy-pages): the built site is
# uploaded as an artifact and served directly — no gh-pages branch, no
# deployment history accumulating in git. The `enablement: true` on
# configure-pages switches the repo's Pages source to "GitHub Actions"
# automatically on first run.
#
# The site is served under https://<owner>.github.io/<repo>/, so the build
# gets BASE_PATH=/<repo>/ (picked up by web/vite.config.ts). If you ever put
# a custom domain in front, drop BASE_PATH (defaults to "/").

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # Enables Pages (source: GitHub Actions) if the repo doesn't have it yet.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
