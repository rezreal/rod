name: buildroot-images

# Builds SD card images for RPi 3/4/5 using Buildroot.
# On a version tag (`v*`) the .img.gz files are attached to the GitHub Release
# alongside the bare binary produced by build.yml.
#
# Uses ubuntu-latest (x86_64) — Buildroot's internal cross-toolchain runs on
# x86_64 hosts and cross-compiles for aarch64.
#
# Buildroot's own checkout/output/dl/ccache dirs all live under $BR
# (runner.temp), deliberately OUTSIDE the git checkout: the `rod` package
# is BR2_PACKAGE_ROD's local-source sync of the whole repo root, and a
# prior version of this workflow put `buildroot/` inside that checkout —
# so rsync kept copying the (self-growing) output directory into itself,
# filling the disk before any real error appeared.
#
# Cache strategy:
#   $BR/dl/     — downloaded source tarballs (~500 MB, rarely changes)
#   $BR/ccache/<board>/ — compiler cache (~200 MB, speeds up rebuilds)
# Cold build (empty caches): ~2h+ per board on a standard runner, hence the
# 240-minute Build timeout below. Warm build (dl + ccache hit): ~20-30 min.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [rpi3_64, rpi4_64, rpi5_64]
    env:
      BR: ${{ runner.temp }}/br

    steps:
      - uses: actions/checkout@v4

      # A full downstream RPi kernel + systemd + toolchain build eats well
      # over the ~14 GB free by default on a standard runner (which ships
      # ~30 GB of preinstalled Android/.NET/GHC/CodeQL toolchains nothing
      # here uses).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
            /usr/local/share/powershell /usr/share/swift
          df -h /

      - name: Install Buildroot host dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential gcc g++ make libncurses5-dev \
            git rsync bc patch gzip bzip2 xz-utils \
            libssl-dev unzip wget cpio \
            file libdevmapper-dev

      - name: Cache Buildroot downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.BR }}/dl
          key: buildroot-dl-${{ hashFiles('buildroot-external/configs/**', 'buildroot-external/package/**') }}
          restore-keys: buildroot-dl-

      - name: Cache ccache (${{ matrix.board }})
        uses: actions/cache@v4
        with:
          path: ${{ env.BR }}/ccache/${{ matrix.board }}
          key: buildroot-ccache-${{ matrix.board }}-${{ github.sha }}
          restore-keys: buildroot-ccache-${{ matrix.board }}-

      - name: Download Buildroot 2024.02 LTS
        run: |
          mkdir -p "$BR/root"
          curl -L https://buildroot.org/downloads/buildroot-2024.02.tar.gz \
            | tar xz --strip-components=1 -C "$BR/root"

      - name: Configure (${{ matrix.board }})
        run: |
          mkdir -p "$BR/output/${{ matrix.board }}"
          make -C "$BR/root" \
            O="$BR/output/${{ matrix.board }}" \
            BR2_EXTERNAL=$(pwd)/buildroot-external \
            BR2_DL_DIR="$BR/dl" \
            BR2_CCACHE_DIR="$BR/ccache/${{ matrix.board }}" \
            rod_${{ matrix.board }}_defconfig

      - name: Build (${{ matrix.board }})
        run: make -C "$BR/output/${{ matrix.board }}"
        timeout-minutes: 240

      - name: Disk space after build
        if: always()
        run: df -h /

      - name: Compress image
        run: |
          gzip -k "$BR/output/${{ matrix.board }}/images/sdcard.img"
          mv "$BR/output/${{ matrix.board }}/images/sdcard.img.gz" \
             rod-${{ matrix.board }}-${{ github.ref_name }}.img.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rod-${{ matrix.board }}-${{ github.ref_name }}
          path: rod-${{ matrix.board }}-${{ github.ref_name }}.img.gz

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: rod-${{ matrix.board }}-${{ github.ref_name }}.img.gz
          fail_on_unmatched_files: true
