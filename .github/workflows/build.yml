name: build-arm64

# Builds + tests rod for the Raspberry Pi (aarch64) and, on a version
# tag (`v*`), attaches the stripped binary to a GitHub Release.
#
# Runs on GitHub's native arm64 hosted runner (`ubuntu-24.04-arm`) — host arch
# == target arch, so it's a plain native build (no cross, no QEMU). Native arm64
# runners are free for public repos; private repos need a plan that includes
# them. If yours doesn't, see the note at the bottom of this file.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  TARGET: aarch64-unknown-linux-gnu

jobs:
  lint:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libdbus-1-dev pkg-config protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        # Runs on Linux, so the bluer/BLE module is compiled and linted too.
        run: cargo clippy --locked --all-targets -- -D warnings

  build:
    runs-on: ubuntu-24.04-arm
    needs: lint
    permissions:
      contents: write # needed to create the release on tags
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libdbus-1-dev pkg-config protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked --all-targets

      - name: Build release
        run: cargo build --locked --release

      - name: Stage artifact
        run: |
          mkdir -p dist
          install -m755 target/release/rod "dist/rod-${TARGET}"
          aarch64-linux-gnu-strip "dist/rod-${TARGET}" || strip "dist/rod-${TARGET}" || true
          file "dist/rod-${TARGET}"
          sha256sum "dist/rod-${TARGET}" | tee "dist/rod-${TARGET}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rod-${{ env.TARGET }}
          path: dist/*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true

# ─────────────────────────────────────────────────────────────────────────────
# No native arm64 runner on your plan? Swap `runs-on: ubuntu-24.04-arm` for
# `ubuntu-latest` and build inside an emulated arm64 container instead:
#
#   - uses: docker/setup-qemu-action@v3
#   - run: ./scripts/build-pi.sh arm64
#     # then the artifact is target/linux-arm64/release/rod
#
# This works anywhere but is much slower (full emulated compile).
